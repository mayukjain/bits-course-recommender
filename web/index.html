<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BITS Course Recommender</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="evidence.css">
</head>
<body>
  <header><div><span class="eyebrow">BITS PILANI</span><h1>Course <em>Recommender</em></h1></div><div id="term" class="term">Loading…</div></header>
  <main>
    <section class="panel profile-panel">
      <div class="section-head"><div><span class="step">01</span><h2>Student profile</h2></div><button id="save" class="ghost">Save profile</button></div>
      <div class="grid">
        <label>Name<input id="name" placeholder="Your name"></label>
        <label>Campus<select id="campus"><option>Pilani</option><option>Goa</option><option>Hyderabad</option><option>Dubai</option></select></label>
        <label>Admission year<input id="admission_year" type="number" min="2018" max="2030" placeholder="2024"></label>
        <label>Current semester<input id="current_semester" placeholder="First 2026–27"></label>
        <label>Currently registered units<input id="current_registered_units" type="number" min="0" max="30" value="0"></label>
        <label>Degree<input id="degree" placeholder="B.E. Computer Science"></label>
        <label>Dual degree<input id="dual_degree" placeholder="Optional"></label>
        <label>Degree level<select id="degree_level"><option value="first_degree">First degree</option><option value="higher_degree">Higher degree</option></select></label>
        <label>Minor<input id="minor" placeholder="Optional"></label>
      </div>
      <label>Completed courses<textarea id="completed_courses" placeholder="CS F111, MATH F111"></textarea></label>
      <label>Current courses<textarea id="current_courses" placeholder="CS F211, MATH F212"></textarea></label>
      <label>Academic interests<textarea id="interests" placeholder="artificial intelligence, design, economics"></textarea></label>
      <div class="requirements"><div><b>Requirement progress</b><small>Enter approved programme-chart totals and completed counts.</small></div><div id="reqInputs"></div></div>
    </section>

    <section class="panel query-panel">
      <div class="section-head"><div><span class="step">02</span><h2>Ask for courses</h2></div></div>
      <form id="queryForm"><textarea id="query" rows="3" placeholder="Suggest AI-related DELs with no midsem and no 8 AM classes"></textarea><button class="primary">Find eligible courses <span>→</span></button></form>
      <div class="examples"><button>Suggest DELs related to AI</button><button>I need a HUEL with project-based evaluation</button><button>Find an OPEL with no attendance requirement</button></div>
    </section>

    <section id="analysis" class="panel hidden"></section>
    <section id="results" class="results"></section>
  </main>
  <footer><span>BITS Academic Course Recommender</span><span>Bulletin · Regulations · Timetable · Handouts</span></footer>
  <script src="app.js"></script>
</body></html>
